name: Deploy GitHub Pages

# One Pages site, two payloads:
#   /        -> site/ verbatim (landing page, /nft-claim forwarder,
#               .well-known app-link files, CNAME, .nojekyll). These are
#               LOAD-BEARING for the native apps' deep links — the
#               artifact must carry them byte-identical at the root.
#   /app/    -> Flutter web build of lib/main_web.dart (the FxFiles web
#               app). Hash URL strategy, so no 404 rewrites needed.
#               --pwa-strategy=none: no service worker, so a deploy can
#               never serve a stale fula_flutter_bg.wasm against new
#               Dart (the classic FRB-on-web footgun).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.41.9'
  # GitHub forces Node 24 for JS actions from 2026-06-16; opt in now so
  # every deploy already runs the post-cutover configuration instead of
  # discovering breakage on the flag day.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify committed wasm bundle matches pinned fula_client
        # web/pkg/ is committed (built by fula-api's release CI from the
        # same codegen run that published the pub package). If someone
        # bumps fula_client without re-running tools/sync-wasm-pkg.ps1,
        # RustLib.init() would reject the stale wasm at runtime — fail
        # the deploy instead.
        run: |
          test -f web/pkg/fula_flutter.js
          test -f web/pkg/fula_flutter_bg.wasm
          test -f web/pkg/VERSION
          LOCK_VER=$(awk '/^  fula_client:/{f=1} f && /version:/{gsub(/[ "version:]/,""); print; exit}' pubspec.lock)
          PKG_VER=$(tr -d ' \r\n' < web/pkg/VERSION)
          echo "fula_client in pubspec.lock: $LOCK_VER ; web/pkg/VERSION: $PKG_VER"
          if [ "$LOCK_VER" != "$PKG_VER" ]; then
            echo "::error::web/pkg ($PKG_VER) does not match fula_client ($LOCK_VER) - run tools/sync-wasm-pkg.ps1 and commit web/pkg/"
            exit 1
          fi

      - name: Build Flutter web app
        run: flutter build web --release -t lib/main_web.dart --base-href /app/ --pwa-strategy=none --no-wasm-dry-run

      - name: Assemble Pages artifact (site/ at root, app under /app/)
        run: |
          mkdir -p out
          cp -r site/. out/
          mkdir -p out/app
          cp -r build/web/. out/app/
          echo "Artifact layout:"
          find out -maxdepth 2 -type f | head -40

      - name: Cache-bust the app bundle
        # GitHub Pages serves everything with `Cache-Control: max-age=600`
        # and we ship `--pwa-strategy=none`, so there is no service worker
        # to force an update. index.html, flutter_bootstrap.js and
        # main.dart.js therefore each cache INDEPENDENTLY for 10 minutes:
        # a browser can revalidate index.html (picking up a new deploy)
        # while still serving the PREVIOUS main.dart.js from disk, and a
        # reload inside the window does not revalidate anything at all.
        # That is not theoretical — two phone net-export captures taken
        # after a deploy show the entire app shell served from cache with
        # no network request, so the device was still running old code
        # while we believed the fix was live (2026-08-22).
        #
        # Stamping the commit SHA onto the script URLs makes the new
        # index.html reference URLs the cache has never seen, so the app
        # code can never be older than the HTML that loaded it. Worst-case
        # staleness collapses to index.html's own 10-minute window, and it
        # self-heals. Wasm under /app/pkg/ is deliberately NOT stamped: the
        # verify step above already pins it to fula_client, and its URL is
        # built by RustLib at runtime.
        run: |
          set -euo pipefail
          V="${GITHUB_SHA:0:12}"
          echo "cache-bust version: $V"
          # Only rewrite quote-delimited references, so a `.map` sibling or
          # a prose mention can never be corrupted into `main.dart.js?v=X.map`.
          sed -i "s|flutter_bootstrap\.js\([\"']\)|flutter_bootstrap.js?v=$V\1|g" out/app/index.html
          sed -i "s|main\.dart\.js\([\"']\)|main.dart.js?v=$V\1|g" out/app/flutter_bootstrap.js
          # Fail loudly rather than silently shipping an unbusted bundle if
          # a future Flutter version changes how these are referenced.
          grep -q "flutter_bootstrap.js?v=$V" out/app/index.html \
            || { echo "::error::index.html was not cache-busted - check how it references flutter_bootstrap.js"; exit 1; }
          grep -q "main.dart.js?v=$V" out/app/flutter_bootstrap.js \
            || { echo "::error::flutter_bootstrap.js was not cache-busted - check how it references main.dart.js"; exit 1; }
          echo "index.html:"; grep -o "flutter_bootstrap.js?v=[a-f0-9]*" out/app/index.html | head -3
          echo "flutter_bootstrap.js:"; grep -o "main.dart.js?v=[a-f0-9]*" out/app/flutter_bootstrap.js | head -3

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

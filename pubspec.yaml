name: fula_files
description: FxFiles - A minimalistic file manager with Fula decentralized storage backup support.
publish_to: 'none'
version: 1.8.0+531

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  
  # Navigation
  go_router: ^17.0.1
  
  # Storage & Files (with Encryption)
  fula_client: ^0.2.26
  path_provider: ^2.1.5
  file_picker: ^10.3.7
  open_filex: ^4.6.0
  mime: ^2.0.0

  # Prevent sleep while syncing (Windows, Android, iOS)
  wakelock_plus: ^1.2.8

  # Local Storage & Security
  flutter_secure_storage: ^10.0.0
  hive_flutter: ^1.1.0

  # Key Derivation (PBKDF2 for deterministic user keys)
  cryptography: ^2.7.0

  # Authentication
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.4
  
  # UI Components
  showcaseview: ^3.0.0
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  image_cropper: ^8.0.2
  video_player: ^2.9.2
  chewie: ^1.10.0
  video_thumbnail: ^0.5.3
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  flutter_pdfview: ^1.4.1
  flutter_syntax_view: ^4.0.0
  rxdart: ^0.28.0
  
  # Permissions
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0
  
  # iOS Photo Library Access
  photo_manager: ^3.6.2
  
  # Face Detection & Recognition
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_image_labeling: ^0.14.1
  google_mlkit_text_recognition: ^0.15.0
  image: ^4.3.0
  
  # Archive/Compression
  archive: ^4.0.4

  # Utils
  package_info_plus: ^8.0.0
  intl: ^0.20.2
  path: ^1.9.0
  uuid: ^4.5.1
  crypto: ^3.0.3
  collection: ^1.19.0
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  http: ^1.2.0
  xml: ^6.5.0
  url_launcher: ^6.2.5
  
  # Background Tasks
  workmanager: ^0.9.0
  connectivity_plus: ^7.0.0
  
  # Sharing
  share_plus: ^12.0.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  
  # Icons
  lucide_icons: ^0.257.0

  # Desktop Window Management
  window_manager: ^0.4.3
  tray_manager: ^0.2.1

  # Deep Links
  app_links: ^6.4.0

  # Network Service Discovery (mDNS/Bonjour for blox discovery)
  nsd: ^4.1.0

  # Wallet/Web3
  reown_appkit: ^1.6.0
  wallet: ^0.0.18
  web3dart: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4
  msix: ^3.16.13

# Temporary override until reown_appkit supports flutter_secure_storage 10.x
# Monitor: https://github.com/reown-com/reown_flutter/issues
dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icons/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#151718"
  image: "assets/icons/icon.png"
  android: true
  ios: true
  android_12:
    color: "#151718"
    image: "assets/icons/icon.png"

msix_config:
  display_name: FxFiles
  publisher_display_name: Functionland
  publisher: CN=E9FEC2DC-DBBE-45BA-A112-26EFEA253DB5
  identity_name: Functionland.FxFiles
  msix_version: 1.8.0.0
  logo_path: assets/icons/icon.png
  capabilities: internetClient, internetClientServer, unvirtualizedResources
  protocol_activation: fxfiles

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
  

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FxFiles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 20px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    p { color: #a1a1aa; line-height: 1.6; margin-bottom: 1.5rem; }
    .stores { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .stores a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      color: #fafafa;
      text-decoration: none;
      font-weight: 500;
      transition: border-color 0.2s;
    }
    .stores a:hover { border-color: #6366f1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">&#x1F4C1;</div>
    <h1>FxFiles</h1>
    <p>Decentralized file manager with NFT minting, FULA storage, and cross-device sync.</p>
    <div class="stores">
      <a href="https://apps.apple.com/app/fxfiles/id1658500313" target="_blank">
        <span>&#x1F34E;</span> App Store
      </a>
      <a href="https://play.google.com/store/apps/details?id=land.fx.files" target="_blank">
        <span>&#x1F4F1;</span> Google Play
      </a>
      <a href="https://apps.microsoft.com/detail/9nxl9kb8fbqq" target="_blank">
        <span>&#x1FA9F;</span> Windows
      </a>
      <a href="/app/">
        <span>&#x1F310;</span> Web App
      </a>
    </div>
  </div>
</body>
</html>
